name: Publish image
# dev: every push publishes :dev (always the latest dev build) and :X.Y.Z-dev.<run>.
# master: a push with a new pyproject.toml version publishes :X.Y.Z, :X.Y and :latest,
# then tags the commit vX.Y.Z and creates a GitHub release. A version that is already
# released is not published again: bump the version to release.
# Every published build also gets :sha-<commit>.
on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: ruff check .
      - run: pytest -q
      - name: Decide the channel
        id: channel
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = master ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::notice::v$version is already released; bump the version in pyproject.toml to publish a release"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.channel.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.channel.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.channel.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.channel.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.channel.outputs.version }},enable=${{ steps.channel.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.channel.outputs.version }},enable=${{ steps.channel.outputs.release }}
            type=raw,value=latest,enable=${{ steps.channel.outputs.release }}
            type=raw,value=dev,enable=${{ steps.channel.outputs.release == 'false' }}
            type=raw,value=${{ steps.channel.outputs.version }}-dev.${{ github.run_number }},enable=${{ steps.channel.outputs.release == 'false' }}
            type=sha,prefix=sha-
      - if: steps.channel.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag and create the GitHub release
        if: steps.channel.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.channel.outputs.version }}" \
            --target "$GITHUB_SHA" --title "v${{ steps.channel.outputs.version }}" --generate-notes
