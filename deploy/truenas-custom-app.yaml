# TrueNAS SCALE: Apps > Discover Apps > menu > Install via YAML.
# Install via YAML has no .env file: replace every /mnt/tank/... path, the Sonarr
# address and both secrets below before pasting. Settings are read at start; edit
# the app and redeploy to change them.
#
#   /mnt/tank/media    dataset holding BOTH downloads and the library (one mount)
#   .../state          SQLite queue/journal (read-write, keep across upgrades)
#   .../config         optional: config.toml with rules and mappings only
services:
  anime-sidecar:
    image: ghcr.io/dd/sidecarr-extras-import:0.1.0
    user: "568:568"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    environment:
      TZ: UTC
      # Paths as seen inside the container (the media dataset is /mnt/media).
      SIDECAR_DOWNLOAD_ROOTS: /mnt/media/downloads/anime
      SIDECAR_LIBRARY_ROOTS: /mnt/media/anime
      SIDECAR_FONT_ROOT: /mnt/media/.anime-sidecar-fonts
      # Sonarr as reachable from this container: NAS LAN IP or host.docker.internal.
      SIDECAR_SONARR_URL: http://host.docker.internal:8989
      SIDECAR_SONARR_API_KEY: <Sonarr Settings > General > API Key>
      # Optional: movies from Radarr too (webhook /webhook/radarr). Remove if unused.
      SIDECAR_RADARR_URL: http://host.docker.internal:7878
      SIDECAR_RADARR_API_KEY: <Radarr Settings > General > API Key>
      # Random string of 32+ characters, e.g. `openssl rand -hex 32`.
      SIDECAR_WEBHOOK_TOKEN: <webhook token>
      SIDECAR_DEFAULT_LANGUAGE: und
      # Keep true until a dry-run report looks right.
      SIDECAR_DRY_RUN: "true"
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/tank/media:/mnt/media
      - /mnt/tank/apps/anime-sidecar/state:/state
      # Optional, for rules and mappings: a directory with config.toml.
      # - /mnt/tank/apps/anime-sidecar/config:/config:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
