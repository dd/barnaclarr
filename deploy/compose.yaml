# Host-specific values come from deploy/.env; see deploy/.env.example.
services:
  anime-sidecar:
    # `up --build` builds this tag locally from the checkout instead of pulling it.
    image: ghcr.io/dd/sidecarr-extras-import:${IMAGE_TAG:-latest}
    build:
      context: ..
    user: "${PUID:-568}:${PGID:-568}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${WEBHOOK_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # One mount, not separate mounts for downloads and library.
      - ${MEDIA_PATH:?set MEDIA_PATH in deploy/.env}:/mnt/media
      - ${CONFIG_PATH:?set CONFIG_PATH in deploy/.env}:/config:ro
      - ${STATE_PATH:?set STATE_PATH in deploy/.env}:/state
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
